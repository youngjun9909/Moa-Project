name: Keep Render server awake (10:00-20:00 KST)

# Render's free web service sleeps after 15 minutes without traffic, and its
# 750 free hours/month are shared across the workspace. Pinging only during the
# daytime window keeps the demo responsive while leaving hours for other projects.
#
# GitHub cron runs in UTC (KST = UTC+9):
#   00:50 UTC = 09:50 KST  -> wake the server shortly before the window opens
#   01:00-10:50 UTC = 10:00-19:50 KST, every 10 minutes
# The last ping at 19:50 KST lets the server sleep around 20:05 KST.
on:
  schedule:
    - cron: "50 0 * * *"
    - cron: "*/10 1-10 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: https://moa-api-0t5a.onrender.com/api/v1/auth/hobbies
    steps:
      - name: Ping the API
        run: |
          # A cold start can take a couple of minutes, so allow a long timeout.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 150 "$HEALTH_URL" || true)
          echo "HTTP status: ${code:-none}"
          # Never fail the job; a missed ping just means the next one wakes the server.
          exit 0
